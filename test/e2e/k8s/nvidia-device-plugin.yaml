# Applied by k3d-up.sh only when the cluster's node actually has a GPU.
#
# This is not the manifest NVIDIA publishes. Theirs assumes the NVIDIA
# container runtime is the node's default, which is true on a real GPU node
# and false in a k3d node container: the node has the device files and the
# driver libraries (k3d passes --gpus all straight through to `docker run`),
# but no toolkit and no nvidia runtime. Every difference below exists because
# the published manifest was measured failing without it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin
  template:
    metadata:
      labels:
        name: nvidia-device-plugin
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.17.1
          env:
            # Allocation answers with CDI device names. containerd 2.x takes
            # CDI devices only through the CRI field the kubelet fills from a
            # device plugin — cdi.k8s.io/* pod annotations are ignored, which
            # was measured: an annotated pod started with no GPU at all.
            - name: DEVICE_LIST_STRATEGY
              value: "cdi-cri"
            # The driver root as the NODE sees it. The CDI spec this plugin
            # generates writes host paths relative to this value, so pointing
            # it at the in-pod mount makes containerd fail to stat
            # /driver-root/dev/nvidia-uvm.
            - name: NVIDIA_DRIVER_ROOT
              value: "/"
            # …and where that root is mounted inside THIS pod, so the plugin
            # can load NVML. Without a whole root it cannot find
            # libcuda.so.<version> and crash-loops.
            - name: CONTAINER_DRIVER_ROOT
              value: "/driver-root"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            # CONTAINER_DRIVER_ROOT alone is not enough for the plugin to
            # load NVML: it still resolves shared libraries through the
            # dynamic linker's own search path, which a bind-mounted root at
            # a NON-standard mount point (/driver-root, not /) does not
            # populate. Without this the plugin's own pods crash-loop with
            # "error starting plugins: unable to validate flags: CDI
            # --device-list-strategy options are only supported on
            # NVML-based systems" -- a message that names the CDI flag, not
            # the missing library path, so nothing about it points here.
            # Measured directly, live, against a real RTX 4060 node: both
            # pods (this DaemonSet's server AND agent replicas -- a k3d
            # cluster this task creates with --agents 1 has two) went
            # Ready and advertised nvidia.com/gpu: 1 only once this variable
            # and the host-libs volume/mount below were both added.
            - name: LD_LIBRARY_PATH
              value: "/host-libs"
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
            - name: driver-root
              mountPath: /driver-root
              readOnly: true
            - name: cdi
              mountPath: /etc/cdi
            # Paired with LD_LIBRARY_PATH above: the actual .so files NVML
            # needs to load, read-only because the plugin only ever reads
            # them.
            - name: host-libs
              mountPath: /host-libs
              readOnly: true
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
        - name: driver-root
          hostPath:
            path: /
        - name: cdi
          hostPath:
            path: /etc/cdi
        - name: host-libs
          hostPath:
            path: /usr/lib/x86_64-linux-gnu
