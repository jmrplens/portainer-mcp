name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy; run go mod tidy"; exit 1; }
      - name: Run tests with coverage
        run: go test ./... -count=1 -race -coverprofile=coverage.out
      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/portainer-mcp

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan
        run: govulncheck ./...

  generated:
    name: "Generated code is current"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Regenerate the client and confirm no drift
        run: |
          make gen-client
          git diff --exit-code internal/portainer/gen/ \
            || { echo "::error::internal/portainer/gen is out of date or was hand-edited; run make gen-client"; exit 1; }

  # There used to be a "Generated action Input structs are current" job here:
  # regenerate, then `git diff --exit-code internal/tools/`. It is retired,
  # not merely removed — see cmd/audit_spec_drift's package doc and
  # docs/domain-wave-checklist.md's "Owning a scaffolded domain" section for
  # the ownership decision this reflects. That check could only notice when
  # regeneration produced a different file, which made it fail on every
  # legitimate hand edit to an owned domain (exactly what P3.2 asks domain
  # owners to do from now on) as readily as on a real defect — a check that
  # cannot tell those apart teaches everyone to stop trusting it. The
  # audit-spec-drift job below is what replaces it.
  #
  # Precisely, not "strictly more": the replacement covers strictly more
  # against *specification drift* — a hand edit or the vendored spec moving
  # out from under the catalog is caught however it arose, not only when a
  # regeneration run happened to disagree with what was committed — and
  # strictly LESS against *arbitrary hand edits to scaffolded code that
  # introduce no spec drift at all*. audit-spec-drift iterates the actions
  # the catalog declares; deleting a whole action from generatedSpecs()
  # shrinks its own "Actions audited" count with no gating finding and no
  # non-zero exit — the old regenerate-and-diff job would have caught that
  # (regeneration would still produce the deleted action, diffing non-empty).
  # cmd/audit_1to1's coverage ratchet is the orthogonal, count-only backstop
  # for that case, and it is imperfect too: a floor on a total, so removing
  # one action and adding an unrelated one passes it silently.
  #
  # Live demonstration of the part this job does cover, on the one mutation
  # this project's own history already had a name for: hand-edited
  # registries/actions.go (actions.gen.go at the time), changing
  # registryInspect's `return redactRegistryInspect(resp.JSON200), nil` to
  # `return resp.JSON200, nil` — P2's original defect, verbatim. Regenerating
  # and diffing (the retired job's own mechanism, run manually against the
  # mutation) failed exactly as CI would have; audit-spec-drift against the
  # identical mutation failed too, naming the operation: "RegistryInspect
  # (registries.inspect): success response can carry [AccessToken Password
  # TLSCACert TLSCert TLSKey], but Handler never calls redactRegistryInspect
  # [GATING]". Both reverted, both clean afterward. See
  # docs/api-divergences.md §9 for the full account, including the
  # -allow-overwrite/scanHandOverrides limitation this same freeze left
  # behind — recorded there, not only in a gitignored working document that
  # does not exist in a fresh clone.

  no-stdout-writes:
    name: "Guard: nothing writes to stdout"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Reject any path that could write to stdout
        run: |
          fail=0

          # Scan every Go package in the module, not a hardcoded directory
          # list: later phases add packages (a generated Portainer client,
          # additional tool surfaces) and this guard must cover them without
          # being told about each new directory.
          dirs=$(go list -f '{{.Dir}}' ./...)

          # os.Stdout must never be referenced in our code: in stdio mode the
          # MCP SDK owns standard output, and any other writer corrupts the
          # JSON-RPC stream. This catches os.Stdout.Write, io.Copy(os.Stdout, …),
          # json.NewEncoder(os.Stdout) and fmt.Fprintf(os.Stdout, …) alike.
          if grep -rnE 'os\.Stdout' --include='*.go' $dirs | grep -v '_test\.go:'; then
            echo "::error::os.Stdout must never be referenced — the MCP SDK owns the transport"
            fail=1
          fi

          # Bare print calls go to stdout (fmt.Print*) or are debug leftovers
          # (the print/println builtins). log.Print* is banned for consistency:
          # this project logs through internal/logging.
          if grep -rnE '(^|[^.[:alnum:]_])(fmt\.Print(f|ln)?|log\.Print(f|ln)?|print|println)\(' \
               --include='*.go' $dirs | grep -v '_test\.go:'; then
            echo "::error::bare print calls write to stdout, which carries the MCP JSON-RPC transport"
            fail=1
          fi

          exit $fail

  no-committed-binaries:
    name: "Guard: no compiled binary is tracked"
    runs-on: ubuntu-latest
    # This guard exists because it happened twice in one day, and the second
    # time the first fix did not stop it. `go build ./cmd/<name>` drops its
    # output in the repository root, a `git add -A` commits it, and a 3.4 MB
    # and a 9.5 MB binary each reached a pull request that way.
    #
    # .gitignore alone cannot be the answer: it was extended after the first
    # incident and the second binary sailed past it, because **gitignore never
    # applies to a file git is already tracking**. The rules stop a NEW build
    # output being added; only a check that reads the index stops one that is
    # already in it.
    steps:
      - uses: actions/checkout@v5
      - name: Reject any tracked file that is a compiled executable
        run: |
          fail=0

          # Read the index, not the working tree: an ignored-but-tracked file
          # is exactly the case this guard exists for, and a working-tree scan
          # would not distinguish it from ordinary build scratch.
          while IFS= read -r path; do
            [ -f "$path" ] || continue
            case "$(head -c 4 "$path" | od -An -tx1 | tr -d ' \n')" in
              7f454c46|cffaedfe|cefaedfe|feedface|feedfacf)
                echo "::error file=$path::$path is a compiled executable and must not be tracked; the Makefile builds into dist/"
                fail=1
                ;;
            esac
          done < <(git ls-files)

          # And name the specific shape that caused both incidents, so the
          # failure says what to do rather than only what is wrong: a tracked
          # file at the repository root sharing a name with a cmd/ package.
          for dir in cmd/*/; do
            name=$(basename "$dir")
            if git ls-files --error-unmatch "$name" >/dev/null 2>&1; then
              echo "::error file=$name::$name is the build output of ./cmd/$name; run 'git rm --cached $name' — adding it to .gitignore does not untrack it"
              fail=1
            fi
          done

          exit $fail

  audit-1to1:
    name: "1:1 API coverage (ratchet)"
    runs-on: ubuntu-latest
    # This is the gate the whole P3 rewrite exists to install: it fails
    # whenever an operation documented in either vendored spec has no
    # matching catalog action, which is what the previous incarnation of
    # this server never checked on its way to 37% coverage.
    #
    # This job does not require 100% coverage — that would fail every pull
    # request for most of P3, which teaches everyone to route around a gate
    # stuck red for months, and previously meant this job ran with
    # continue-on-error so the standing failure would not block every commit.
    # A job that never fails is just as useless, though: it would let
    # coverage decay silently. Instead this runs `make audit-1to1-ratchet`,
    # which fails only when coverage drops below the floor committed in
    # api/coverage-baseline.yaml — see cmd/audit_1to1/main.go's runRatchet
    # doc comment for the full reasoning. That is what lets this be a real,
    # required check (no continue-on-error) from day one: it is green today
    # and tightens automatically as each P3 wave lands a domain and bumps the
    # baseline in the same commit.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Report 1:1 coverage of both vendored specs by the action catalog, gated on the ratchet
        run: make audit-1to1-ratchet

  audit-spec-drift:
    name: "Catalog matches the vendored specification (no ratchet)"
    runs-on: ubuntu-latest
    # Unlike audit-1to1 above, this gate requires a clean result from day
    # one, not a ratchet: every declared action was generated from (or, for
    # the hand-written pilots, checked directly against) the vendored
    # specification this job compares it to, so there is no partial-coverage
    # period to phase in — see cmd/audit_spec_drift's package doc for the
    # full reasoning, including its mandatory canary self-test and its
    # conditional treatment of description-only findings.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Report drift between the catalog and the vendored specification it was generated from
        run: make audit-spec-drift
