name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy; run go mod tidy"; exit 1; }
      - name: Run tests with coverage
        run: go test ./... -count=1 -race -coverprofile=coverage.out
      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/portainer-mcp

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan
        run: govulncheck ./...

  generated:
    name: "Generated code is current"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Regenerate the client and confirm no drift
        run: |
          make gen-client
          git diff --exit-code internal/portainer/gen/ \
            || { echo "::error::internal/portainer/gen is out of date or was hand-edited; run make gen-client"; exit 1; }

  generated-action-inputs:
    name: "Generated action Input structs are current"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Regenerate action Input structs and confirm no drift
        run: |
          make gen-action-inputs
          git diff --exit-code internal/tools/ \
            || { echo "::error::an internal/tools/*/inputs.gen.go is out of date or was hand-edited; run make gen-action-inputs"; exit 1; }

  no-stdout-writes:
    name: "Guard: nothing writes to stdout"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Reject any path that could write to stdout
        run: |
          fail=0

          # Scan every Go package in the module, not a hardcoded directory
          # list: later phases add packages (a generated Portainer client,
          # additional tool surfaces) and this guard must cover them without
          # being told about each new directory.
          dirs=$(go list -f '{{.Dir}}' ./...)

          # os.Stdout must never be referenced in our code: in stdio mode the
          # MCP SDK owns standard output, and any other writer corrupts the
          # JSON-RPC stream. This catches os.Stdout.Write, io.Copy(os.Stdout, …),
          # json.NewEncoder(os.Stdout) and fmt.Fprintf(os.Stdout, …) alike.
          if grep -rnE 'os\.Stdout' --include='*.go' $dirs | grep -v '_test\.go:'; then
            echo "::error::os.Stdout must never be referenced — the MCP SDK owns the transport"
            fail=1
          fi

          # Bare print calls go to stdout (fmt.Print*) or are debug leftovers
          # (the print/println builtins). log.Print* is banned for consistency:
          # this project logs through internal/logging.
          if grep -rnE '(^|[^.[:alnum:]_])(fmt\.Print(f|ln)?|log\.Print(f|ln)?|print|println)\(' \
               --include='*.go' $dirs | grep -v '_test\.go:'; then
            echo "::error::bare print calls write to stdout, which carries the MCP JSON-RPC transport"
            fail=1
          fi

          exit $fail

  audit-1to1:
    name: "1:1 API coverage (informational until P3 completes)"
    runs-on: ubuntu-latest
    # This is the gate the whole P3 rewrite exists to install: it fails
    # whenever an operation documented in either vendored spec has no
    # matching catalog action, which is what the previous incarnation of
    # this server never checked on its way to 37% coverage. With 18 of 441
    # Business Edition operations declared, cmd/audit_1to1 fails today and
    # keeps failing for most of P3 — that is correct, not a bug to silence.
    # continue-on-error keeps that expected failure from turning this
    # repository's required checks red: a gate that blocks every commit for
    # months teaches everyone to route around it instead. Remove
    # continue-on-error, making this job required, only once the count it
    # reports reaches zero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Report 1:1 coverage of both vendored specs by the action catalog
        run: make audit-1to1
