name: e2e

# The whole estate is cheap: ~25s for the two compose Portainers, an agent and
# an edge agent; another ~2 minutes for k3d plus the Helm chart (measured,
# see plan/carry-forward.md). The sibling project (gitlab-mcp-server) gates
# its equivalent Kubernetes leg behind workflow_dispatch because GitLab alone
# takes ~5 minutes to boot; that reasoning does not transfer here, so both
# legs run on every pull request rather than one being opt-in.
#
# test/e2e/suite is behind the `e2e` build tag, so it never runs as part of
# the default `make test` / the main ci.yml workflow, whether or not this one
# is green.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"

jobs:
  e2e:
    name: Ephemeral Portainer estate
    runs-on: ubuntu-latest
    # Generous ceiling for image pulls on a cold runner, not for the estate
    # itself: the measured total is well under 3 minutes end to end.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Provide the Business Edition licence
        # Absent secret is not a failure: the Community Edition legs still
        # run, and the Business Edition legs (and the edge domains, which are
        # Business Edition only) skip with a named reason instead — see
        # Sessions.For in test/e2e/suite. A fork's pull request has no access
        # to repository secrets, and a red build for a secret a contributor
        # cannot supply would be a bad first experience.
        #
        # The key never becomes a command-line argument and is never echoed:
        # printf writes it straight to a file from the env var, exactly like
        # up.sh/down.sh read it back out through read_licence. chmod 600
        # matches the ownership the harness itself writes secrets with
        # (writeOwnerOnlyAtomic).
        env:
          PORTAINER_LICENSE: ${{ secrets.PORTAINER_LICENSE }}
        run: |
          if [ -n "$PORTAINER_LICENSE" ]; then
            printf 'PORTAINER_LICENSE=%s\n' "$PORTAINER_LICENSE" > .env
            chmod 600 .env
            echo "Business Edition legs enabled" >&2
          else
            echo "no licence secret available: Community Edition legs only" >&2
          fi

      - name: Confirm the Docker daemon accepts a privileged container
        # Docker-in-Docker (test/e2e/docker-compose.yml's own "docker"
        # service) needs `privileged: true`. GitHub-hosted Linux runners
        # allow a *nested* container started by a regular `docker` command to
        # run privileged — this is not the same as the job itself running
        # inside a container via the `container:` key with `--privileged`,
        # which hosted runners do restrict. This step fails fast, with a
        # named cause, rather than letting a privileged-container refusal
        # surface as an opaque compose failure three steps later.
        run: |
          if docker run --rm --privileged hello-world >/dev/null; then
            echo "privileged containers are permitted on this runner" >&2
          else
            echo "::error::this runner refuses privileged containers; the compose Docker-in-Docker leg cannot run here"
            exit 1
          fi

      - name: Bring up the compose estate (Community + Business Edition + agent)
        run: make e2e-up

      - name: Install the Kubernetes tooling (k3d, kubectl, helm)
        # Every tool is a specific, tagged release rather than whatever a
        # mutable branch ref or a "latest stable" pointer currently answers,
        # and every download is checksummed against that release's own
        # published SHA-256 before it is installed. k3d's version matches the
        # one k3d-up.sh pins the deployed chart's image to (see its own
        # comment); kubectl and Helm are pinned to versions verified against
        # that k3d release at the time this step was written.
        env:
          K3D_VERSION: v5.9.0
          K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
          KUBECTL_VERSION: v1.32.13
          KUBECTL_SHA256: db2ae479a63f3665d7f704ab18c0d4d4050144237980763221835b7305703c4c
          HELM_VERSION: v3.21.3
          HELM_SHA256: 15e041a93a590dce8100f39385cd98c84a765c9e36aeeb9e2dc6ff9e4769e2e0
        run: |
          set -euo pipefail

          curl -sfLo k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum -c -
          chmod +x k3d
          sudo mv k3d /usr/local/bin/k3d

          curl -sfLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          curl -sfLo helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          chmod +x linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tar.gz linux-amd64

      - name: Bring up the Kubernetes leg (k3d + Portainer via Helm)
        run: make e2e-k8s-up

      - name: Run the pilot-domain suite against the live estate
        run: make test-e2e

      - name: Report unexercised catalog actions (informational, not a gate)
        if: always()
        run: make audit-e2e-gaps

      - name: Tear down
        # always(): a failure in any step above — provisioning, the suite,
        # even a cancelled job — must still release the Business Edition
        # licence and remove the estate. Each teardown step is best-effort
        # (`|| true`): a stuck cluster or container must never be the reason
        # the licence fails to release, and vice versa. The gitignored .env
        # is removed on this same always() path so it never survives past
        # the job that created it, on the success path or the failure one.
        if: always()
        run: |
          make e2e-k8s-down || true
          make e2e-down || true
          rm -f .env
