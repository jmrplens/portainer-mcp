version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - .Wrap(
  exclusions:
    # Generated files are exempt via their "Code generated ... DO NOT EDIT." header.
    # Stated explicitly rather than relying on the default: internal/portainer/gen
    # is ~100k generated lines, and flipping this silently unleashes them.
    generated: strict
    rules:
      # Table-driven tests routinely ignore returned errors on setup helpers,
      # and duplicated literals in fixtures are intentional.
      - path: _test\.go$
        linters:
          - gosec
          - wrapcheck

formatters:
  enable:
    - gofumpt
    - goimports
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/jmrplens/portainer-mcp)
