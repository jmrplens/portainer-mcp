# Portainer MCP 1:1 API coverage ratchet baseline.
#
# cmd/audit_1to1's CI job (invoked with -ratchet; see .github/workflows/ci.yml)
# fails only when coverage drops below the numbers recorded here. It does not
# require 100% coverage — that stays `make audit-1to1`'s job, the one a human
# asking "are we done" runs, and it keeps failing on any uncovered operation
# regardless of this file.
#
# ce_covered / ee_covered are the number of Community/Business Edition
# operations the catalog covers today (auditResult.CE.Covered /
# .EE.Covered, printed by the audit's own report as "covered: N of Total").
# Update both numbers in the same commit that improves them: a wave that
# lands new domain actions raises coverage, the CI job then reports the
# baseline as stale (still green, never a failure), and bumping the numbers
# here in that same commit is what makes the improvement itself visible in
# the diff, rather than left for the ratchet to silently absorb. Never lower
# either number to make a regression pass — that defeats the one thing this
# file exists to catch.
#
# Only the covered counts are committed here, never the totals, and 2026-08-18
# is why that distinction is worth stating. The audit stopped skipping routes
# with no operationId that day: GET /endpoint_groups/{id} is named by neither
# vendored document, so it had been silently absent from both denominators,
# and internal/specnaming now names it. The totals moved — CE 251 -> 252, EE
# 441 -> 442 — while these two numbers did not, because the newly visible
# route is uncovered, not covered. A ratchet keyed on totals would have gone
# red for a change that only made the real surface visible.
ce_covered: 71
ee_covered: 93
