# Deliberate divergences cmd/audit_spec_drift will never gate the build on.
#
# Every entry requires:
#   operation_id  the exported Go identifier oapi-codegen assigns to the
#                 operation (e.g. "TagDelete" for the raw operationId
#                 "tagDelete") — the same form toolutil.ActionSpec.OperationID
#                 and internal/specdiff.OperationShape.OperationID use, so
#                 this file and a reported finding can be compared directly.
#   field         the JSON wire name of exactly one field of that operation —
#                 never the whole operation. A hand-written action that takes
#                 a deliberately narrower type does so for one or two fields,
#                 not its entire shape, and excusing the whole operation would
#                 also excuse any unrelated field that starts drifting later
#                 under the same entry's forgiveness.
#   reason        why this field will always differ from the vendored
#                 specification.
#   added         the ISO 8601 date (YYYY-MM-DD) the entry was added.
#
# audit_spec_drift excludes every entry here from its pass/fail gate but
# always prints every finding, allow-listed or not, alongside the audit
# summary: an allow-list that can hide an entry from its own report is how
# drift decays while the check still looks clean. An entry that excuses
# nothing a real run currently finds gating is itself a build error — the
# operation may no longer exist, the field may no longer diverge, or the
# entry may simply be a typo that never matched anything — because a stale
# entry would otherwise keep forgiving something that no longer needs it,
# and a real, unrelated divergence on the same field could later inherit
# that forgiveness silently.
#
# This file is empty again, as of task 4 of P3.2's freeze. It briefly held 35
# entries, all "$title"/"$description" (internal/specdiff.TitleSentinel/
# DescriptionSentinel) excusing a deliberately hand-authored operation-level
# Title or Description — every domain's narrative() hook and, before task 4,
# the four hand-written pilot actions (RegistryConfigure, EcrDeleteTags,
# RepositoryTagsDelete, SystemUpgrade) that assigned Title/Description
# directly in their ActionSpec literal instead of through toolutil.WithNarrative.
# That mechanism worked, but it recorded the identical decision — "this
# action's own wording deliberately improves on the specification's" — in
# TWO places for every overridden action: once in the domain's own narrative()
# hook or literal, once again here. toolutil.ActionSpec grew
# TitleOverridden/DescriptionOverridden (set by toolutil.WithNarrative) so
# that decision is recorded exactly once, at the point the override is made,
# and cmd/audit_spec_drift's isGating reads it directly
# (specdiff.FieldChange.AfterOverridden) instead of needing an entry here to
# say the same thing a second time. The four pilot actions were converted to
# route through WithNarrative too (see registries.go's and system.go's own
# narrative() functions), which is what let every one of the 35 entries come
# out at once rather than 27 of them.
#
# A parameter-level "$title"/"$description" override no longer has an allow-
# list mechanism to fall back on if this file ever needs one again for that
# case specifically: none exists today (every declared action's parameter
# shape matches the vendored specification's own field-level prose exactly),
# and if one is ever needed, prefer extending TitleOverridden/
# DescriptionOverridden's approach (a fact recorded once, at the point of the
# override) over reviving a parallel allow-list entry for it.
#
# The three entries below are the first back into this file since it emptied:
# a real "type" divergence each, not a title/description improvement, so
# TitleOverridden/DescriptionOverridden's mechanism above does not apply to
# them at all. See docs/api-divergences.md §6.3 for the full measurement.
#
# The eight custom_templates entries after those three arrived with wave 1
# stage B. Six landed in the commit that registered the domain (a divergence
# entry added before its domain is registered matches nothing and is
# reported stale, which is itself a build error); the seventh followed once
# the estate was up and the enum below was measured, and the eighth once the
# decision to correct Note's requiredness was taken. They are three kinds:
#
#   - four "requiredness" entries, where a live 2.44.0 was measured
#     enforcing a required array different from the vendored one in both
#     directions. This matters more than a documentation defect normally
#     would because toolutil.ActionSpec.ValidateInput enforces
#     required-ness locally, before the handler runs
#     (internal/tools/register.go): publishing the vendored arrays verbatim
#     would make a model that fills exactly the required fields take a 500
#     on every call. See docs/api-divergences.md §3.7.
#   - three "description" entries on CustomTemplateCreateFile, where a
#     field's published description elaborates on the specification's. Note
#     that these are FIELD-level descriptions, which isGating
#     (cmd/audit_spec_drift/audit.go) treats differently from the
#     operation-level $title/$description kinds: it fires on any non-empty
#     Before and does not consult AfterOverridden, so toolutil.WithNarrative
#     buys them nothing and an entry here is the only instrument available.
#   - one "enum" entry, where create/repository publishes a wider set of
#     stack types than the vendored specification declares. The document
#     gives that route {1,2} while its own field description advertises
#     "3 - kubernetes" and both sibling routes accept 3; a live 2.44.0 was
#     measured accepting 3 on both editions, so the narrower enum was the
#     defect. See docs/api-divergences.md §6.5.

- operation_id: DockerContainerGpusInspect
  field: containerId
  reason: >-
    containerId is Docker's own 64-character hexadecimal container ID,
    assigned by the Docker engine itself and never a number in any Docker
    installation. The vendored specification's "type": "integer" is simply
    wrong about what Portainer reads off the wire here — not a looser type
    this catalog chose for convenience, but a correction of a documentation
    defect. The generated client bakes the same wrong type into its method
    signature (DockerContainerGpusInspect(ctx, environmentId int,
    containerId int, ...)), which is why this operation is hand-written
    rather than generated: publishing "integer" would make the action
    look well-formed while being uncallable with any container ID Docker
    has ever actually assigned.
  added: 2026-08-08

- operation_id: ContainerImageStatus
  field: containerId
  reason: >-
    Identical defect to DockerContainerGpusInspect's containerId above, on a
    different route: this is Docker's 64-character hexadecimal container ID,
    never a number, and the vendored specification's "type": "integer" is
    wrong about it, not merely narrower than what this catalog chose.
  added: 2026-08-08

- operation_id: ServiceImageStatus
  field: serviceId
  reason: >-
    serviceId is Docker Swarm's own alphanumeric service ID (for example
    "9mnpnzenvg8p8tdbtq4wvbkcz"), assigned by Swarm and never a number in any
    real deployment. The vendored specification's "type": "integer" is wrong
    about what Portainer reads off the wire, the same class of defect as
    containerId above. A small integer such as "1" can be made to resolve
    against a hand-labelled probe container in a test estate, which is
    exactly why this is not treated as a looser convenience type: no real
    Swarm deployment ever assigns a numeric service ID, so "string" is what
    real callers need, not a relaxation chosen for this catalog's benefit.
    See docs/api-divergences.md's "The cheat this is written down to
    forbid" for why a test that only proves a realistic string resolves is
    not sufficient evidence this field is actually string-typed.
  added: 2026-08-08

- operation_id: CustomTemplateCreateRepository
  field: platform
  reason: >-
    Measured against a live Portainer 2.44.0, Community and Business Edition
    alike (2026-08-14): a Type 2 (compose) template created with no Platform
    is refused with 500 "Invalid custom template platform", while the
    vendored required array omits the field entirely. The field's own
    description already says "Required for Docker stacks", so the prose is
    right and the array is wrong. ValidateInput enforces required-ness
    locally, before the handler runs, so publishing the vendored array
    verbatim would make every model that fills exactly the required fields
    omit Platform and take that 500. See docs/api-divergences.md §3.7.
  added: 2026-08-14

- operation_id: CustomTemplateCreateRepository
  field: sourceId
  reason: >-
    Measured against a live Portainer 2.44.0, Community and Business Edition
    alike (2026-08-14): RepositoryURL plus Platform 1 with no SourceID at all
    answers 200 and clones the repository, and SourceID 0 sent explicitly
    behaves identically, while the vendored required array lists the field.
    (SourceID is read when a real identifier is supplied — 99999 answers 500
    "Source not found" — so it is optional rather than ignored.) Because
    ValidateInput enforces required-ness locally, publishing the vendored
    array verbatim would refuse outright every caller cloning from the
    inline repository fields for lacking a SourceID the server never wanted.
    See docs/api-divergences.md §3.7.
  added: 2026-08-14

- operation_id: CustomTemplateCreateString
  field: platform
  reason: >-
    The same measurement as CustomTemplateCreateRepository.platform above, on
    the sibling JSON create route: a live 2.44.0 on both editions refuses a
    Type 2 template with no Platform (500 "Invalid custom template
    platform") although the vendored required array omits it. Listed
    separately because this allow-list keys on (operation_id, field) — one
    entry may never excuse two operations, so one measured decision spanning
    two routes needs one entry per route. Deliberately NOT extended to
    CustomTemplateUpdate, which carries the same "Required for Docker
    stacks" note but was never probed. See docs/api-divergences.md §3.7.
  added: 2026-08-14

- operation_id: CustomTemplateCreateFile
  field: edgeSettings
  reason: >-
    The vendored description, "A json object of edge config", is copied from
    the two JSON create routes where EdgeSettings really is a nested object.
    On this multipart route the schema types it "string" — a JSON document
    inside a form field — and the published text says so ("...passed as a
    JSON-encoded string"). Kept rather than reverted: the vendored wording
    on a string-typed field steers a model into sending a nested object,
    which the handler would marshal into the part and Portainer would then
    fail to unmarshal, the exact mistake this action's handler tests pin.
    The divergence is recorded here rather than hidden.
  added: 2026-08-14

- operation_id: CustomTemplateCreateFile
  field: file
  reason: >-
    The vendored description of this field is the single word "File". It is
    the one field carrying the stack file body, and published as "Content of
    the stack file to upload" because the content itself — not a path — is
    what crosses the tool boundary: the specification types it "string"
    with format "binary", and a model has no way to name a path on the
    filesystem this process runs on. One word that repeats the field name
    tells a model nothing it could act on, so the elaboration is kept and
    the divergence recorded here.
  added: 2026-08-14

- operation_id: CustomTemplateCreateFile
  field: variables
  reason: >-
    Same shape as edgeSettings above: the vendored "A json array of
    variables definitions" is accurate on the JSON create routes, where the
    field is a real array, and misleading on this multipart route, where the
    schema types it "string". Published as "...passed as a JSON-encoded
    string" so a caller encodes the array itself instead of handing over a
    structure this route cannot carry.
  added: 2026-08-14

- operation_id: CustomTemplateCreateRepository
  field: type
  reason: >-
    Published as enum [1, 2, 3] where the vendored specification declares
    [1, 2] on this route alone — its own description advertises "3 -
    kubernetes" and both sibling routes (create/string, PUT
    /custom_templates/{id}) declare all three. Measured against a live
    Portainer 2.44.0, Community and Business Edition alike (2026-08-18): a
    Type 3 template created from a git repository answers 200 and comes back
    stored as type 3. The neighbouring routes' declaration was NOT the
    evidence — a live server was, which is the distinction
    docs/api-divergences.md §6.5 insisted on before this could be widened,
    and that section prescribed exactly this entry on exactly this
    measurement.
  added: 2026-08-18

- operation_id: CustomTemplateCreateFile
  field: note
  reason: >-
    Measured 2026-08-18 against a live 2.44.0, Community and Business Edition
    alike: a multipart body with no Note part at all answers 200, and the
    template comes back with "Note":"". The vendored document lists Note in
    this route's required array and lists it optional on both JSON create
    routes, so it is wrong here and right two routes away. Published optional
    to match the server, for the same reason as the Platform and SourceID
    entries above: toolutil.ActionSpec.ValidateInput enforces required-ness
    locally, before the handler runs, so publishing the document's array
    verbatim would make this catalog refuse a request Portainer accepts. See
    docs/api-divergences.md §3.7.
  added: 2026-08-18

- operation_id: StackDeleteKubernetesByName
  field: namespace
  reason: >-
    Published although neither vendored document declares it, because the
    server requires it. Measured 2026-08-18 against a live 2.44.0 on both
    editions: DELETE /stacks/name/{name}?endpointId=1 answers
    400 "Invalid query parameter: namespace", and the same call with
    &namespace=default answers 204. The check runs before the environment is
    resolved -- supplying namespace and omitting endpointId moves the failure
    on to a 404 -- so it is unconditionally required, not required only for
    some Kubernetes branch. Without this field the action could not send the
    parameter at all, and every call it could make failed: the generated
    client's own StackDeleteKubernetesByNameParams carries only External and
    EndpointId, both derived from the same document. See
    docs/api-divergences.md §3.9.
  added: 2026-08-18

# The five entries below arrived with wave 1's endpoints domain. Four are
# field-level "description" entries of the kind CustomTemplateCreateFile's
# three above already are — a multipart format:binary field whose vendored
# description says "file" where what actually crosses the tool boundary is
# the file's content. The fifth is a "type" entry of the kind the three
# docker ones at the top of this file are.

- operation_id: EndpointCreate
  field: tlsCACertFile
  reason: >-
    The vendored description, "TLS CA certificate file", names a file, and a
    model reading it sends a path. It cannot: the specification types this
    field "string" with format "binary", a model has no way to name a path
    on the filesystem this process runs on, and the hand-written handler
    writes whatever it is given as the multipart part's own bytes. Published
    as "Content of the TLS CA certificate, in PEM form" so the caller sends
    the certificate rather than a path to one — the identical decision, on
    the identical shape, as the CustomTemplateCreateFile.file entry above.
  added: 2026-08-18

- operation_id: EndpointCreate
  field: tlsCertFile
  reason: >-
    Identical to tlsCACertFile above, on the client certificate rather than
    the CA certificate. Listed separately because this allow-list keys on
    (operation_id, field) and one entry may never excuse two fields.
  added: 2026-08-18

- operation_id: EndpointCreate
  field: tlsKeyFile
  reason: >-
    Identical to tlsCACertFile above, on the client key. Worth stating once
    for all three: registering an agent environment through endpoints.create
    is the one place this catalog carries private key material, so a
    description that leaves a caller guessing between "a path" and "the key"
    is the description most worth correcting in the domain.
  added: 2026-08-18

- operation_id: EndpointDockerBrowsePut
  field: file
  reason: >-
    The vendored description is "The file to upload", on a field the
    specification types "string" with format "binary". Published as "Content
    of the file to upload" for the reason the EndpointCreate TLS entries
    above give: the content is what crosses the tool boundary, and a
    description naming a file steers a caller into sending a path this
    catalog can neither read nor forward.
  added: 2026-08-18

- operation_id: SnapshotContainerInspect
  field: containerId
  reason: >-
    The same defect as the three docker entries at the top of this file, on
    the fourth and last of the operations docs/api-divergences.md §6.3
    measured: the vendored specification declares this path parameter
    "integer" and Portainer reads it as an opaque Docker container ID — a
    64-character hexadecimal string — which it passes straight through. This
    operation is tagged ["endpoints", "docker"] and lands in the endpoints
    domain because cmd/gen_action_inputs routes by tags[0], which is why it
    arrives one wave after its three siblings. The generated client bakes the
    wrong type into its signature (SnapshotContainerInspectWithResponse(ctx,
    environmentId int, containerId int)), so the action is hand-written and
    builds its own request; publishing "integer" instead would make it look
    well-formed while being uncallable with any container ID Docker has ever
    assigned.
  added: 2026-08-18
