# Deliberate divergences cmd/audit_spec_drift will never gate the build on.
#
# Every entry requires:
#   operation_id  the exported Go identifier oapi-codegen assigns to the
#                 operation (e.g. "TagDelete" for the raw operationId
#                 "tagDelete") — the same form toolutil.ActionSpec.OperationID
#                 and internal/specdiff.OperationShape.OperationID use, so
#                 this file and a reported finding can be compared directly.
#   field         the JSON wire name of exactly one field of that operation —
#                 never the whole operation. A hand-written action that takes
#                 a deliberately narrower type does so for one or two fields,
#                 not its entire shape, and excusing the whole operation would
#                 also excuse any unrelated field that starts drifting later
#                 under the same entry's forgiveness.
#
#                 Also accepts "$title" or "$description"
#                 (internal/specdiff.TitleSentinel/DescriptionSentinel) to
#                 excuse a deliberately hand-authored operation-level Title or
#                 Description — a domain's narrative() hook or a fully
#                 hand-written ActionSpec literal replacing the vendored
#                 specification's own summary/description with improved,
#                 permanent prose. toolutil.WithNarrative fully replaces
#                 Title/Description rather than tagging which fields it
#                 touched, so there is nothing left on toolutil.ActionSpec by
#                 the time ShapeFromCatalog reads it to recognise "this was a
#                 deliberate override" from directly — this file is where
#                 that decision is recorded instead, the same way it already
#                 records a parameter's deliberately narrower type.
#   reason        why this field will always differ from the vendored
#                 specification.
#   added         the ISO 8601 date (YYYY-MM-DD) the entry was added.
#
# audit_spec_drift excludes every entry here from its pass/fail gate but
# always prints every finding, allow-listed or not, alongside the audit
# summary: an allow-list that can hide an entry from its own report is how
# drift decays while the check still looks clean. An entry that excuses
# nothing a real run currently finds gating is itself a build error — the
# operation may no longer exist, the field may no longer diverge, or the
# entry may simply be a typo that never matched anything — because a stale
# entry would otherwise keep forgiving something that no longer needs it,
# and a real, unrelated divergence on the same field could later inherit
# that forgiveness silently.
#
# The 35 entries below are this file's first real divergences, added the
# same day OperationShape grew Title/Description (previously this file was
# empty: every declared action's *parameter* shape matched the vendored
# specification exactly). Every one was verified by reading the domain
# source directly, not inferred from the audit's report alone: each is
# either a domain's narrative() hook (registries.go, system.go, tags.go)
# supplying improved Title/Description for an otherwise-generated action, or
# one of the four hand-written pilot actions (RegistryConfigure,
# EcrDeleteTags, RepositoryTagsDelete, SystemUpgrade) that declares its own
# ActionSpec literal directly. None of these is accidental staleness — see
# this task's own report for the investigation that ruled that out before a
# single entry below was added.
- operation_id: "EcrDeleteRepository"
  field: "$title"
  reason: >-
    registries/registries.go's narrative() hook preserves this domain's own hand-authored wording from before its swap to generated code, deliberately improving on the vendored specification's terser summary/description.
  added: "2026-08-04"
- operation_id: "EcrDeleteRepository"
  field: "$description"
  reason: >-
    registries/registries.go's narrative() hook preserves this domain's own hand-authored wording from before its swap to generated code, deliberately improving on the vendored specification's terser summary/description.
