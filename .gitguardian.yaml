version: 2
secret:
  ignored-paths:
    # Fixed, published admin credentials for the disposable e2e estate this
    # harness provisions and tears down on every run (see AdminPassword's own
    # doc comment in test/e2e/harness/provision.go). It is not a secret: the
    # estate is unreachable from outside the test network, and
    # isHarnessProvisioned (test/e2e/suite/fixtures_test.go) relies on this
    # exact value being fixed to confirm cleanupOrphans is only ever pointed
    # at a server this harness itself provisioned.
    - test/e2e/harness/provision.go
